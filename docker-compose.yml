version: '3.8'

networks:
  qlvt-net:
    external: true
    name: qlvt-net

services:
  # Dịch vụ ứng dụng ASP.NET Core
  app:
    build:
      context: ./ # Đường dẫn đến thư mục chứa Dockerfile
      dockerfile: Dockerfile
    container_name: qlvt-app
    restart: unless-stopped
    networks:
      - qlvt-net

  # Dịch vụ NGINX Reverse Proxy
  nginx:
    image: nginx:latest
    container_name: qlvt-nginx
    restart: unless-stopped
    ports:
      - "5000:80" # Map cổng 5000 của host vào cổng 80 của container NGINX
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro # Mount file cấu hình NGINX
    depends_on:
      - app # Đảm bảo app khởi động trước nginx
    networks:
      - qlvt-net